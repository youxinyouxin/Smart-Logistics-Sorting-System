# ============================================================
# 双舵机配置
# 程序每次执行舵机动作时都会重新读取本文件：
#   改完保存即可，下一次分拣动作生效，无需重启服务。
#
# 舵机1：GPIO34（排针 32 脚，硬件 PWM）
#   当前按“位置舵机”配置：2200us = 起始点，1200us = 推出角度
#   一次动作：2200 起 → 缓推到 1200 → 停 hold_sec → 缓推回 2200
#   想减小摆幅：swing_us 调大（1300/1400）；想加大：调小（1100）
#
#   如果这只舵机其实是“连续旋转舵机”（1200/2200 只是速度而非角度），
#   把 servo1_mode 改成 continuous，并启用下面的连续模式参数。
#
# 舵机2：普通位置舵机（GPIO71，软件 50Hz）
#   2900us = 你校准的起始点，1500us = 顺时针约 90°
# ============================================================

# 舵机1：位置模式
servo1_mode: position
servo1_home_us: 2200
servo1_swing_us: 1200
# 舵机1 推出/回位时长：越小越快（0 = 沿用 ramp_sec）
servo1_ramp_sec: 0.2
# 动作结束后继续输出 home 脉冲保持位置（防止松开信号后舵机乱转）
servo1_hold_after: true

# 舵机1：连续旋转模式参数（servo1_mode: continuous 时才生效）
# servo1_stop_us: 1500
# servo1_push_us: 1200
# servo1_return_us: 1800
# servo1_push_sec: 1.2
# servo1_return_sec: 1.2

# 舵机2：普通位置舵机
#   2900us 超出常见 500~2500us 量程，容易顶限位、回不到位；先改为 2450
servo2_home_us: 2450
servo2_swing_us: 1500

# ---------------- 动作时序（秒） ----------------
# 动作前先保持 home 的时间
pre_home_sec: 0.2

# 位置舵机从 home 推到 swing 的时长
ramp_sec: 1.0

# 在推出位置保持的时长
hold_sec: 1.0

# 回位后的收尾停留时长
tail_sec: 0.3

# set ... home 指令保持的时长
home_hold_sec: 2.0
