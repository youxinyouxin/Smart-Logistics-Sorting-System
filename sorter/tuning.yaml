# ============================================================
# 分拣调参文件（sorter_cpp3）
# 程序启动时读取；优先级高于 sorter_cpp.json；改完重启生效：
#   systemctl restart sorter-cpp2
# 说明：画面 1280x720，快递从右向左移动（rtl），x=0 在左、1280 在右
# ============================================================

# ---------------- 触发几何 ----------------
# 胶布中心 x 像素（物理参照点）
#   往快递前进方向（画面左侧/出口）移 -> 减小
#   往进料方向（画面右侧/上游）移 -> 增大
tape_x: 770

# 货运（前沿越线，1 号舵机）补偿：正值 = 提前触发
#   推得早 -> 减小；推得晚 -> 加大
front_lead_px: 0

# 空运（后沿越线，2 号舵机）补偿：负值 = 延后触发
#   还早 -> 再减 20（-70 -> -90）；变晚 -> 回调（-70 -> -50）
back_lead_px: -55

# 离场判定余量（px）
exit_margin_px: 140

# 异常件最长等待时间（秒）：超时后释放串行锁、停传送带
exit_timeout_sec: 12

# ---------------- 识别与重试 ----------------
# 锁定所需可见比例：越小越早开始识别，但标签可能被裁
min_visible_ratio: 0.85

# 单件最多 OCR 次数（第二次仅在“未识别到省份”时发生）
ocr_max_attempts: 2

# 第一次未识别到省份：传送带短脉冲时长（秒），停带后再识别一次
ocr_retry_pulse_sec: 0.5

# 第二次仍未识别到省份：传送带定时清出时长（秒），到点停带并处理下一件
ocr_fail_belt_run_sec: 5.0

# 省内件：目标从画面消失后，再运行多久停带（秒）
province_lost_stop_sec: 1.0
# 省内件直通安全兜底：最长运行时间（秒），防止目标一直不消失
province_max_run_sec: 20.0

# ---------------- 跟踪与锁定 ----------------
# 锁定前最少可见帧数
min_frames_to_lock: 3

# 连续尺寸稳定帧数（放置未稳/手扶时不锁定）
stable_frames_to_lock: 3

# 允许的宽/高抖动比例
max_width_jitter: 0.1

# 入画侧边缘安全距离（px），避免锁定还没进画面的快递
edge_margin_px: 100

# 连续丢失多少帧后进入丢失宽限处理
max_miss_frames: 10

# 相邻帧匹配的最大位移（px）
match_max_dist: 130

# 丢失目标后的幽灵保存时长（秒）
ghost_ttl_sec: 2.5

# 活动件丢失后的宽限期（秒），期间等待恢复/分类结果
lost_grace_sec: 5.0

# ---------------- 实时显示（降卡顿） ----------------
# 只显示传送带区域（按 1280x720 坐标裁剪）
display_crop_x: 110
display_crop_y: 230
display_crop_w: 1169
display_crop_h: 430

# 窗口输出分辨率（越小越流畅）
display_width: 640
display_height: 235

# 显示窗口刷新上限（fps，和处理帧率解耦，建议 2~3）
display_fps: 12.0
# 显示画面左右翻转（镜像；只影响显示，不影响检测/OCR/坐标）
display_flip: true

# ---------------- 处理帧率自适应 ----------------
# 基准帧率（CPU 较高、且没有 OCR/LLM 任务时）
fps: 12.0
# OCR 或 LLM 运行时的处理帧率（给模型让出 CPU）
fps_low: 1.0
# CPU 空闲时的处理帧率
fps_high: 24.0
# CPU 占用高于该比例时回落到基准帧率
cpu_high_ratio: 0.65
# CPU 采样周期（秒）
fps_check_sec: 1.0
